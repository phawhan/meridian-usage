[project]
name = "meridian-usage"
version = "0.1.0"
description = "Usage and admin service for Meridian's Claude and Gemini assistant"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "pyyaml>=6.0.2",
]

[project.scripts]
meridian = "app.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "httpx2>=2.13", "ruff>=0.8", "mypy>=1.13", "types-pyyaml"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Leaked connections or files fail the suite instead of scrolling past as warnings.
filterwarnings = ["error::ResourceWarning", "error::pytest.PytestUnraisableExceptionWarning"]

[tool.mypy]
python_version = "3.13"
strict = true
