name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: make setup

      # Lint, mypy strict, tsc, every test (including scoping through the MCP protocol and one
      # stdio run with real processes), the console build, and provision --check: the three
      # environments render, validate, and match what is committed.
      - name: make check
        run: make check

      - name: Claude Code's own plugin and marketplace validation
        run: |
          claude() { npx -y @anthropic-ai/claude-code@2.1.300 "$@"; }
          claude plugin validate --strict .
          for env in dev staging prod; do claude plugin validate --strict "deploy/$env/plugin"; done
